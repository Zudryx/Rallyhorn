name: Release

# Push to "main": run the tests, and if the version in Rallyhorn.toc hasn't
# been released yet, publish GitHub release vX.Y.Z with the addon zip and
# RallyhornUpdater.zip. "Update Rallyhorn.bat" installs it from there. Every
# finished change is released this way, so the owner never has to copy files
# by hand.
#
# CurseForge is NOT automatic. It only gets a version when the owner says the
# changes are complete: then run this workflow by hand on main with
# "upload". Its changelog covers every version since the last upload.
#
# Push to "testing" (optional, for trying something before it's released):
# publish a GitHub pre-release vX.Y.Z-test.N. "Update Rallyhorn
# (testing).bat" installs those. Only the newest test build is kept.

on:
  push:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      curseforge:
        description: "CurseForge: check = test the token and show the changelog, nothing uploaded; upload = send the current main version"
        type: choice
        options: [nothing, check, upload]
        default: nothing

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Tests
        run: |
          lua5.3 tests/run_tests.lua
          python3 tests/lint51.py Rallyhorn

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -m1 '^## Version:' Rallyhorn/Rallyhorn.toc | sed 's/## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          CORE=$(grep -m1 'readMetadata("Version") or "' Rallyhorn/Core.lua | sed 's/.*or "\([^"]*\)".*/\1/')
          if [ "$VERSION" != "$CORE" ]; then
            echo "::error::Rallyhorn.toc says $VERSION but the fallback in Core.lua says $CORE. Bump both."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # The addon folder already carries its README, LICENSE and NOTICE.md.
          zip -r "Rallyhorn-$VERSION.zip" Rallyhorn -x "*.DS_Store"
          # Release notes = this version's entry under "## Changes" in Rallyhorn/README.md.
          python3 .github/scripts/changelog.py Rallyhorn/README.md --version "$VERSION" > notes.md
          [ -s notes.md ] || echo "Rallyhorn $VERSION" > notes.md
          # The Windows updater, attached to every release
          cp LICENSE updater/LICENSE.txt
          (cd updater && zip -r ../RallyhornUpdater.zip "Update Rallyhorn.bat" "Update Rallyhorn (testing).bat" "Update-Rallyhorn.ps1" LICENSE.txt)
          cat notes.md

      - name: Test build (testing branch)
        if: github.ref_name == 'testing'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          N: ${{ github.run_number }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # docs-only pushes after a release: nothing new to test
            echo "::notice::v$VERSION is already released, so no test build. Bump the version to make the next one."
            for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- "^v$VERSION-test\." || true); do
              gh release delete "$t" --cleanup-tag -y
            done
            exit 0
          fi
          TAG="v$VERSION-test.$N"
          { echo "**Test build $N of Rallyhorn $VERSION.** For trying changes early, so it can have bugs. Not on CurseForge."
            echo "To install it, run \"Update Rallyhorn (testing).bat\" from RallyhornUpdater.zip, or download the Rallyhorn zip below."
            echo
            cat notes.md; } > test-notes.md
          # keep only the newest test build
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- '-test\.' || true); do
            gh release delete "$t" --cleanup-tag -y
          done
          gh release create "$TAG" "Rallyhorn-$VERSION.zip" RallyhornUpdater.zip --prerelease --target "$GITHUB_SHA" \
            --title "Rallyhorn $VERSION (test $N)" --notes-file test-notes.md

      - name: Publish release if this version is new
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."
            exit 0
          fi
          gh release create "v$VERSION" "Rallyhorn-$VERSION.zip" RallyhornUpdater.zip --target "$GITHUB_SHA" \
            --title "Rallyhorn $VERSION" --notes-file notes.md
          # this version's test builds have done their job
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- "^v$VERSION-test\." || true); do
            gh release delete "$t" --cleanup-tag -y
          done

      - name: CurseForge (only when run by hand)
        # Only when the owner says the changes are complete: Actions > Release >
        # Run workflow on main with "upload". Never on a push, never a test build.
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.curseforge != 'nothing'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          MODE: ${{ inputs.curseforge }}
        run: |
          if ! grep -q '^## X-Curse-Project-ID:' Rallyhorn/Rallyhorn.toc; then
            echo "::error::Rallyhorn.toc has no ## X-Curse-Project-ID line yet (see MAINTAINING.md)."
            exit 1
          fi
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::There's no CF_API_KEY secret (see MAINTAINING.md)."
            exit 1
          fi
          # The "curseforge" tag marks the last commit sent there.
          SINCE=""
          if git fetch --quiet --depth=1 origin "+refs/tags/curseforge:refs/tags/curseforge" 2>/dev/null; then
            SINCE=$(git show curseforge:Rallyhorn/Rallyhorn.toc | grep -m1 '^## Version:' | sed 's/## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          fi
          if [ "$SINCE" = "$VERSION" ] && [ "$MODE" = upload ]; then
            echo "::error::Rallyhorn $VERSION is already on CurseForge. Release a new version on main first."
            exit 1
          fi
          # changelog = every version since the last upload (CurseForge users skip the ones in between)
          if [ -n "$SINCE" ]; then
            python3 .github/scripts/changelog.py Rallyhorn/README.md --version "$VERSION" --since "$SINCE" > cf-notes.md
          fi
          [ -s cf-notes.md ] || cp notes.md cf-notes.md
          echo "Last version on CurseForge: ${SINCE:-none}. Changelog:"
          cat cf-notes.md
          # the exact zip the GitHub release (and the updater) has
          gh release download "v$VERSION" -p "Rallyhorn-$VERSION.zip" --clobber
          if [ "$MODE" = check ]; then
            python3 .github/scripts/curseforge_upload.py --toc Rallyhorn/Rallyhorn.toc \
              --file "Rallyhorn-$VERSION.zip" --version "$VERSION" --changelog cf-notes.md --dry-run
            echo "::notice::CurseForge token works. Nothing was uploaded."
            exit 0
          fi
          python3 .github/scripts/curseforge_upload.py --toc Rallyhorn/Rallyhorn.toc \
            --file "Rallyhorn-$VERSION.zip" --version "$VERSION" --changelog cf-notes.md
          git tag -f curseforge "$GITHUB_SHA"
          git push -f origin refs/tags/curseforge
          echo "::notice::Rallyhorn $VERSION was sent to CurseForge."
